name: CI

# Runs on every branch, not just main. A pipeline that only fires on the
# default branch pushes you toward committing there, which is the habit the
# branch protection is meant to remove.
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's own
  # gitleaks_8.30.1_checksums.txt (https://github.com/gitleaks/gitleaks/releases/tag/v8.30.1).
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  SHELLCHECK_VERSION: "0.11.0"
  # sha256 of shellcheck-v0.11.0.linux.x86_64.tar.xz, from the GitHub
  # release asset digest (`gh api repos/koalaman/shellcheck/releases/tags/v0.11.0`
  # — shellcheck's own release process does not publish a separate
  # checksums file).
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"

jobs:
  # Fastest feedback first: a lint failure in seconds beats a test run.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Pinned, not apt. The distro package lags, and its diagnostics differ
      # from a current release — which is how a locally-clean script failed
      # here on the first run. Same binary locally and in CI, or the check is
      # not reproducible.
      - name: Install linters
        run: |
          curl -sSfL -o shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          rm shellcheck.tar.xz
          ./shellcheck --version
          pip install --require-hashes -r .github/workflows/ci-requirements.txt

      - name: ShellCheck
        run: |
          ./shellcheck bin/calypsocode
          ./shellcheck -x test/run.sh test/helpers.sh test/mutate.sh test/*.test.sh

      # config/ holds only what the launcher tells people to copy. An obsolete
      # example sitting beside a supported one reads as a second supported
      # option, which is how the dead local-proxy template kept getting found.
      # Archives live in docs/archive/ and are checked separately below.
      - name: Check config/ carries only supported examples
        run: |
          test -f config/profile.example.env
          shopt -s nullglob
          stray=(config/*.json config/*.json.example config/*.yaml config/*.yml)
          if [ ${#stray[@]} -gt 0 ]; then
            echo "Unsupported example(s) in config/: ${stray[*]}" >&2
            echo "Supported templates only. Archives belong in docs/archive/." >&2
            exit 1
          fi

      # Archived examples are not runnable, but they are cited by findings, so
      # they still have to parse — a quoted example nobody can read is worse
      # than no example.
      - name: Validate archived examples still parse
        run: |
          shopt -s nullglob
          yaml=(docs/archive/*.yaml docs/archive/*.yml)
          json=(docs/archive/*.json docs/archive/*.json.example)
          if [ ${#yaml[@]} -eq 0 ] && [ ${#json[@]} -eq 0 ]; then
            echo "No archived example found in docs/archive/"
            exit 1
          fi
          for f in "${yaml[@]}"; do
            echo "Checking $f"
            yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable, comments-indentation: disable}}" "$f"
          done
          for f in "${json[@]}"; do
            echo "Checking $f"
            python3 -m json.tool "$f" > /dev/null
          done

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Hermetic: no network, no Tor, no real agent. Everything the launcher
      # talks to is stubbed, so a green run here means the logic is right, not
      # that the machine happened to be online.
      - name: Run the test suite
        run: ./test/run.sh

  # A small, home-grown mutation runner (test/mutate.sh) — see its header for
  # why this is not a general mutation-testing framework. It copies
  # bin/calypsocode into a scratch directory, applies one exact security
  # mutation at a time, and runs the focused suite that should catch each one.
  #
  # continue-on-error: true is deliberate, not a placeholder. This job is new
  # and has not yet run clean across enough real commits to trust as a merge
  # gate — a flaky or over-eager mutant here would otherwise block unrelated
  # work. Promote it to blocking once it has stayed green for a few weeks of
  # normal changes: drop continue-on-error and add `mutation-testing` to any
  # required-checks list alongside `test`.
  mutation-testing:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run the mutation suite
        run: ./test/mutate.sh

  # A tool whose entire subject is keeping secrets out of the wrong places has
  # no business leaking one into its own history.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history, so the scan can see past commits

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
          ./gitleaks version

      - name: Scan working tree
        run: ./gitleaks detect --source . --no-git --redact --exit-code 1

      - name: Scan full history
        run: ./gitleaks detect --source . --redact --exit-code 1

      # Public evidence must not carry the maintainer's real OS username or
      # home path — see docs/FINDINGS.md's finding-correction policy. Gitleaks
      # looks for secrets, not this; a plain grep is enough.
      - name: Scan for real local usernames/paths
        run: |
          pattern="/home/matheo(/|[^a-zA-Z0-9_-]|\$)"
          if grep -rnE "$pattern" --include='*' --exclude-dir=.git \
              --exclude='ci.yml' .; then
            echo "Found a real local path/username in tracked files. Replace with <user>/<home>/<project> placeholders." >&2
            exit 1
          fi
